[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-ecu-lab"
version = "0.1.0"
description = "AUTO ECU LAB — Auto Elétrica Doidinho: análise e diagnóstico OBD-II em leitura"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
hardware = ["pyserial>=3.5,<4", "bleak>=0.22,<3"]

[project.scripts]
auto-ecu-lab = "auto_ecu_lab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auto_ecu_lab = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
